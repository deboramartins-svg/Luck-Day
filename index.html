<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luck Day</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botão de Alternar Tema -->
    <button id="themeToggleBtn" title="Alternar Tema">☀︎︎</button>

    <div class="grid-3d"></div>

    <main class="container">
        <header class="header">
            <h1>Luck Day</h1>
            <p id="countdownTimer">> CARREGANDO_CONTAGEM...</p>
        </header>

        <div class="add-box">
            <input type="text" id="newItemInput" placeholder="Adicionar item/gear..." autocomplete="off">
            <button id="addItemBtn">+</button>
        </div>

        <div class="projects-grid" id="shoppingGrid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
