<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luck Day</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Botão com ícone vetorial sem cor própria -->
    <button id="themeToggleBtn" title="Alternar Tema">
        <!-- Ícone padrão de Sol/Lua minimalista -->
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
    </button>

    <div class="grid-3d"></div>

    <main class="container">
        <header class="header">
            <h1>Luck Day</h1>
        </header>

        <div class="add-box">
            <input type="text" id="newItemInput" placeholder="Adicionar item..." autocomplete="off">
            <button id="addItemBtn">+</button>
        </div>

        <div class="projects-grid" id="shoppingGrid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
